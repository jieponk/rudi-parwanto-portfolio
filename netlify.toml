[build]
  command = "node scripts/build-blog.js"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/master/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
