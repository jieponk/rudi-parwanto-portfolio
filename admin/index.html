<!doctype html>
<html lang="id">
<head>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#1f1f1f">
  <title>Blog Admin — Rudi Parwanto</title>
</head>
<body>
  <!--
    Blog CMS: Sveltia CMS (drop-in replacement for Decap CMS).
    Uses the same admin/config.yml and the GitHub OAuth proxy in worker.js.
    To roll back to Decap, replace the script below with:
    <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
    <script>CMS.registerPreviewStyle("/admin/preview.css");</script>
  -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  <script type="module">
    // Optional: Sveltia may ignore custom preview styles; guard so nothing breaks.
    try { window.CMS?.registerPreviewStyle?.('/admin/preview.css'); } catch (e) {}
  </script>
</body>
</html>
