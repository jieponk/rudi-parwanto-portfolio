backend:
  name: github
  repo: jieponk/rudi-parwanto-portfolio
  branch: main

site_url: https://rudiparwanto.netlify.app
display_url: https://rudiparwanto.netlify.app
logo_url: /assets/foto-profil.webp

media_folder: assets/blog
public_folder: /assets/blog

collections:
  - name: blog
    label: Blog Posts
    label_singular: Artikel
    folder: content/blog
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Judul, name: title, widget: string }
      - { label: Slug URL, name: slug, widget: string, hint: "Huruf kecil dan tanda minus. Contoh: optimasi-listing-shopee" }
      - { label: Tanggal Publikasi, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Deskripsi SEO, name: description, widget: text, hint: "Ideal sekitar 140–160 karakter." }
      - label: Kategori
        name: category
        widget: select
        default: E-Commerce
        options: [E-Commerce, Marketplace, Product SEO, Campaign, Workflow, Camera & Gear, Case Study, Tips]
      - label: Label / Tags
        name: labels
        widget: list
        required: false
        default: [E-Commerce]
        hint: "Contoh: Marketplace, Shopee, Product SEO. Label yang dipakai otomatis muncul di menu Labels blog."
      - { label: Thumbnail, name: image, widget: image, required: false }
      - { label: Isi Artikel, name: body, widget: markdown }

  - name: settings
    label: Blog Settings
    files:
      - name: blog_settings
        label: Featured Post
        file: content/settings/blog.json
        format: json
        fields:
          - label: Artikel yang Disematkan
            name: featured_slug
            widget: relation
            collection: blog
            search_fields: [title, slug]
            value_field: slug
            display_fields: [title]
            hint: "Pilih satu artikel. Artikel lama otomatis tidak lagi menjadi Featured Post."
