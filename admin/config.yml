backend:
  name: github
  repo: jieponk/rudi-parwanto-portfolio
  branch: main
  base_url: https://masrudi.site
  auth_endpoint: api/auth
  site_domain: masrudi.site

site_url: https://masrudi.site
display_url: https://masrudi.site
logo_url: /assets/foto-profil.webp

media_folder: assets/blog
public_folder: /assets/blog

collections:
  - name: blog
    label: Blog Posts
    label_singular: Artikel
    folder: content/blog
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Judul, name: title, widget: string }
      - { label: Slug URL, name: slug, widget: string, hint: "Huruf kecil dan tanda minus. Contoh: optimasi-listing-shopee" }
      - { label: Tanggal Publikasi, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Deskripsi SEO, name: description, widget: text, hint: "Ideal sekitar 140–160 karakter." }
      - label: Kategori
        name: category
        widget: relation
        collection: settings
        file: taxonomy
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
        value_field: "categories.*.name"
        default: E-Commerce
        hint: "Kelola daftar kategori di menu Pengaturan → Kategori & Label."
      - label: Label / Tags
        name: labels
        widget: relation
        collection: settings
        file: taxonomy
        search_fields: ["labels.*.name"]
        display_fields: ["labels.*.name"]
        value_field: "labels.*.name"
        multiple: true
        required: false
        hint: "Pilih satu atau beberapa label. Tambah label baru di menu Pengaturan → Kategori & Label."
      - { label: Thumbnail, name: image, widget: image, required: false, hint: "Opsional. Jika dikosongkan, blog otomatis memakai /assets/blog/no-image.webp agar layout tetap rapi." }
      - label: Isi Artikel
        name: body
        widget: markdown
        modes: [rich_text, raw]
        sanitize_preview: true
        hint: "Gunakan Rich Text untuk menulis biasa atau Markdown untuk mengetik Markdown. Jangan paste dokumen HTML lengkap seperti <article>...</article>."

  - name: settings
    label: Pengaturan
    files:
      - name: blog_settings
        label: Featured Post
        file: content/settings/blog.json
        format: json
        fields:
          - label: Artikel yang Disematkan
            name: featured_slug
            widget: relation
            collection: blog
            search_fields: [title, slug]
            value_field: slug
            display_fields: [title]
            hint: "Pilih satu artikel. Artikel lama otomatis tidak lagi menjadi Featured Post."
      - name: taxonomy
        label: Kategori & Label
        file: content/settings/taxonomy.json
        format: json
        fields:
          - label: Kategori
            name: categories
            widget: list
            summary: "{{fields.name}}"
            hint: "Satu artikel punya satu kategori. Mengganti nama kategori tidak mengubah artikel lama secara otomatis."
            fields:
              - { label: Nama, name: name, widget: string }
              - { label: Deskripsi, name: description, widget: text, required: false }
          - label: Label
            name: labels
            widget: list
            summary: "{{fields.name}}"
            hint: "Label muncul di menu Labels blog dan punya halaman sendiri (/blog/label/nama-label/). Deskripsi tampil di halaman label."
            fields:
              - { label: Nama, name: name, widget: string }
              - { label: Deskripsi, name: description, widget: text, required: false }
      - name: site
        label: Musik Latar
        file: content/settings/site.json
        format: json
        fields:
          - label: Musik
            name: music
            widget: object
            fields:
              - { label: Aktifkan musik, name: enabled, widget: boolean, default: true, hint: "Jika dimatikan, layar pembuka kembali otomatis dan tombol musik disembunyikan." }
              - label: File musik (MP3)
                name: file
                widget: file
                media_folder: /assets/music
                public_folder: /assets/music
                hint: "Upload MP3 maksimal ±5 MB. Gunakan musik yang boleh dipakai (buatan sendiri atau bebas royalti). Beri nama file baru agar pengunjung langsung mendapat lagu terbaru."
              - { label: Judul lagu, name: title, widget: string, required: false }
              - { label: Artis, name: artist, widget: string, required: false }
              - { label: Kredit / lisensi, name: credit, widget: string, required: false, hint: "Isi jika lisensi musik mewajibkan kredit." }
              - { label: Volume (0–100), name: volume, widget: number, value_type: int, min: 0, max: 100, default: 35 }
